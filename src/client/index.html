<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Blubba: blast your friends off the map</title>
    <meta name="description" content="Blast your friends off floating maps as a wacky inflatable tube man. Free, in your browser, no download." />
    <meta name="theme-color" content="#4a9ff5" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Blubba" />

    <!-- Link previews (Discord, iMessage, Slack, X, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blubba" />
    <meta property="og:title" content="Blubba" />
    <meta property="og:description" content="Blast your friends off floating maps as a wacky inflatable tube man. Free, in your browser, no download." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Blubba logo over a floating car-park map, with inflatable tube men" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blubba" />
    <meta name="twitter:description" content="Blast your friends off floating maps as a wacky inflatable tube man. Free, in your browser." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Icons and home-screen install -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blubba" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Fonts are self-hosted; preloading them means the menu draws in its real font the first time. -->
    <link rel="preload" href="/fonts/fredoka-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./style.css" />
    <!-- The loading screen is styled inline so it shows before anything else arrives. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse at 50% 30%, #8fd3ff 0%, #4a9ff5 55%, #3a86e0 100%);
        font-family: 'Fredoka', 'Arial Rounded MT Bold', 'Arial Rounded MT', ui-rounded, system-ui, sans-serif;
        font-weight: 700;
        color: #1d1b3a;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      #splash.gone {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      #splash .splash-logo {
        font-size: min(17vw, 140px);
        line-height: 1;
        font-weight: 600;
        letter-spacing: 6px;
        -webkit-text-stroke: min(0.7vw, 5px) #1d1b3a;
        paint-order: stroke fill;
        text-shadow: 0 4px 0 #1d1b3a;
        transform: rotate(-4deg);
      }
      #splash .splash-logo span {
        display: inline-block;
        animation: splash-bob 0.9s ease-in-out infinite;
      }
      #splash .splash-logo span:nth-child(1), #splash .splash-logo span:nth-child(5) { color: #ffd60a; }
      #splash .splash-logo span:nth-child(2), #splash .splash-logo span:nth-child(6) { color: #ff3b8a; }
      #splash .splash-logo span:nth-child(3) { color: #2ec5ff; animation-delay: 0.2s; }
      #splash .splash-logo span:nth-child(4) { color: #5ee05e; animation-delay: 0.3s; }
      #splash .splash-logo span:nth-child(2) { animation-delay: 0.1s; }
      #splash .splash-logo span:nth-child(5) { animation-delay: 0.4s; }
      #splash .splash-logo span:nth-child(6) { animation-delay: 0.5s; }
      #splash .splash-bar {
        width: min(260px, 60vw);
        height: 18px;
        border: 4px solid #1d1b3a;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        overflow: hidden;
        box-shadow: 0 4px 0 #1d1b3a;
      }
      #splash .splash-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: repeating-linear-gradient(-45deg, #ff3b8a 0 10px, #ff7ab4 10px 20px);
        animation: splash-load 1.1s ease-in-out infinite alternate;
      }
      #splash .splash-note {
        font-size: 18px;
        color: #fff;
        text-shadow: 0 2px 0 #1d1b3a;
      }
      @keyframes splash-bob {
        50% { transform: translateY(-8px) scale(0.96, 1.06); }
      }
      @keyframes splash-load {
        from { transform: translateX(-10%); }
        to { transform: translateX(160%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-logo span, #splash .splash-bar i { animation: none; }
        #splash .splash-bar i { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Blubba">
      <div class="splash-logo" aria-hidden="true"><span>B</span><span>L</span><span>U</span><span>B</span><span>B</span><span>A</span></div>
      <div class="splash-bar" aria-hidden="true"><i></i></div>
      <div class="splash-note">Pumping up the tube men...</div>
    </div>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <noscript><div class="noscript">Blubba needs JavaScript to run. Turn it on and reload the page.</div></noscript>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
